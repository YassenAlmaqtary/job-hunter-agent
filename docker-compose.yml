# Base stack: production-style app (no bind mount). Redis is optional via profile.
# Development (hot reload + bind mount): docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

name: job-hunter-agent

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-hunter-agent:${IMAGE_TAG:-latest}
    container_name: job-hunter-agent-app
    restart: unless-stopped
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    env_file:
      - path: .env
        required: false
    environment:
      # API keys (override via .env)
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      # LangGraph / LangChain
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      # Redis checkpointing: leave empty for memory; use redis://redis:6379/0 with --profile with-redis
      REDIS_URL: ${REDIS_URL:-}
      LANGGRAPH_CHECKPOINTER_BACKEND: ${LANGGRAPH_CHECKPOINTER_BACKEND:-memory}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - agent-net

  redis:
    image: redis:7-alpine
    container_name: job-hunter-agent-redis
    profiles:
      - with-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge

volumes:
  redis_data:
